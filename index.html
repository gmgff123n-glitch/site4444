<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11352c">
  <meta name="description" content="تنظيف المجلس في مكة وجدة بـ139 ريال فقط">
  <title>تنظيف المجلس بـ139 ريال</title>
  <style>
    :root {
      --green: #11352c;
      --green-2: #1c5a49;
      --cream: #fffaf1;
      --orange: #e67d3d;
      --gold: #f4c36c;
      --muted: #718078;
      --line: #e9dece;
      --white: #fff;
      --shadow: 0 24px 70px rgba(26, 51, 43, .14);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--green);
      background:
        radial-gradient(circle at 12% 10%, rgba(244,195,108,.22), transparent 28%),
        radial-gradient(circle at 92% 88%, rgba(212,234,218,.62), transparent 30%),
        var(--cream);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    .page { width: min(100% - 24px, 560px); margin: auto; padding: 22px 0 38px; }
    .card {
      position: relative;
      overflow: hidden;
      text-align: center;
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(233,222,206,.9);
      border-radius: 30px;
      box-shadow: var(--shadow);
    }
    .card::before {
      content: "";
      position: absolute;
      top: -94px;
      right: -94px;
      width: 210px;
      height: 210px;
      border: 1px solid rgba(244,195,108,.55);
      border-radius: 50%;
      box-shadow: 0 0 0 22px rgba(244,195,108,.09), 0 0 0 45px rgba(244,195,108,.06);
    }
    .hero {
      position: relative;
      padding: 34px 20px 29px;
      color: var(--white);
      background: var(--green);
    }
    .hero::after {
      content: "";
      position: absolute;
      bottom: -55px;
      left: -38px;
      width: 150px;
      height: 150px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 50%;
    }
    .mark {
      position: relative;
      z-index: 1;
      width: 53px;
      height: 53px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      color: var(--green);
      background: var(--gold);
      border-radius: 17px 17px 17px 4px;
      font-size: 1.45rem;
      font-weight: 900;
      transform: rotate(-5deg);
    }
    .eyebrow {
      position: relative;
      z-index: 1;
      margin: 0 0 8px;
      color: var(--gold);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .05em;
    }
    h1, h2, p { position: relative; z-index: 1; }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 9vw, 3.25rem);
      line-height: 1.15;
      letter-spacing: -.04em;
    }
    .location {
      margin: 12px 0 0;
      color: rgba(255,255,255,.78);
      font-size: .94rem;
    }
    .offer {
      position: relative;
      padding: 28px 20px 25px;
      border-bottom: 1px solid var(--line);
    }
    .offer-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--orange);
      background: #fff1e7;
      font-size: .75rem;
      font-weight: 900;
    }
    .offer-label::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 4px rgba(230,125,61,.12);
    }
    .price-line {
      display: flex;
      justify-content: center;
      align-items: end;
      gap: 9px;
      margin: 13px 0 3px;
    }
    .price {
      color: var(--orange);
      font-size: clamp(3.3rem, 15vw, 5.2rem);
      line-height: .9;
      font-weight: 900;
      letter-spacing: -.09em;
    }
    .currency {
      padding-bottom: 6px;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 900;
    }
    .limited { margin: 0; color: var(--muted); font-size: .82rem; }
    .details { padding: 23px 20px 25px; }
    .details h2 { margin: 0 0 16px; font-size: 1.08rem; }
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .features li {
      min-height: 92px;
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
      padding: 10px 5px;
      color: var(--green);
      background: #f4f8f1;
      border: 1px solid #e1eddf;
      border-radius: 15px;
      font-size: .75rem;
      font-weight: 800;
      line-height: 1.45;
    }
    .icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: var(--green-2);
      background: #deefe0;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 900;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }
    .button {
      min-height: 52px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 12px 10px;
      border-radius: 13px;
      color: var(--white);
      font-size: .86rem;
      font-weight: 900;
      transition: transform .2s, filter .2s;
    }
    .button:hover { transform: translateY(-2px); filter: brightness(.96); }
    .button svg { width: 18px; height: 18px; }
    .call { background: var(--orange); }
    .whatsapp { background: #208c61; }
    .contact-number {
      display: inline-block;
      margin-top: 13px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
      direction: ltr;
    }
    footer {
      padding: 21px 18px 22px;
      color: var(--muted);
      background: rgba(255,255,255,.42);
      border-top: 1px solid var(--line);
      font-size: .76rem;
    }
    footer p { margin: 0 0 4px; }
    .designer { color: var(--green); font-weight: 900; }
    .designer a { color: var(--green-2); text-decoration: underline; text-underline-offset: 3px; }
    .copyright { font-size: .7rem; }
    .side-actions {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 12px;
      display: grid;
      gap: 8px;
      transform: translateY(-50%);
    }
    .side-action {
      width: 47px;
      height: 47px;
      display: grid;
      place-items: center;
      color: var(--white);
      border-radius: 50%;
      box-shadow: 0 9px 22px rgba(17,53,44,.22);
      transition: transform .2s, filter .2s;
    }
    .side-action:hover { transform: scale(1.08); filter: brightness(.96); }
    .side-action svg { width: 21px; height: 21px; }
    .side-action.call-side { background: var(--orange); }
    .side-action.whatsapp-side { background: #208c61; }
    @media (max-width: 380px) {
      .features { gap: 6px; }
      .features li { font-size: .68rem; }
      .buttons { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .side-actions { left: 8px; }
      .side-action { width: 43px; height: 43px; }
    }
  </style>
</head>
